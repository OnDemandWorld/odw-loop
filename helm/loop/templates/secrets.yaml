apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: loop
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  encryptionKey: {{ required "global.encryptionKey is required (set --set global.encryptionKey=...)" .Values.global.encryptionKey | b64enc | quote }}
  jwtSecret: {{ required "global.jwtSecret is required (set --set global.jwtSecret=...)" .Values.global.jwtSecret | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secret
  labels:
    app.kubernetes.io/name: loop
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  password: {{ required "postgresql.auth.password is required" .Values.postgresql.auth.password | b64enc | quote }}
