apiVersion: v2
name: loop
description: Loop — Orchestration layer for the ODW.ai sovereign agent suite
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - workflow
  - orchestration
  - automation
  - odw
home: https://github.com/OnDemandWorld/odw-loop
sources:
  - https://github.com/OnDemandWorld/odw-loop
maintainers:
  - name: ODW.ai Team
# Audit #31: the deployments reference <release>-postgresql and
# <release>-redis-master — actually ship them as chart dependencies.
dependencies:
  - name: postgresql
    version: "12.12.10"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.17.1"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
